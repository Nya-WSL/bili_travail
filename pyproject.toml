[project]
name = "bili-travail"
version = "1.37"
description = "基于blivedm的B站直播加班姬"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiodns>=4.0.0",
    "aiohttp>=3.13.3",
    "apscheduler>=3.11.2",
    "brotli>=1.2.0",
    "icmplib>=3.0.4",
    "loguru>=0.7.3",
    "nicegui>=3.7.1",
    "nuitka>=4.0.7",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pure-protobuf>=3.1.5",
    "py-cpuinfo>=9.0.0",
    "pywebview>=6.1",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "tomlkit>=0.14.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "qiniu>=7.17.0",
]
