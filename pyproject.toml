[project]
name = "bili-travail"
version = "1.33.0"
description = "基于blivedm的B站直播加班姬"
authors = [
    {name = "Nya-WSL"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "nicegui (==3.7.1)",
    "pywebview (>=6.1,<7.0)",
    "brotli (>=1.1.0,<2.0.0)",
    "aiohttp (==3.13.3)",
    "requests (>=2.32.5,<3.0.0)",
    "qrcode[pil] (>=8.2,<9.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "py-cpuinfo (>=9.0.0,<10.0.0)",
    "pure-protobuf (~=3.1.2)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "tomlkit (>=0.13.3,<0.14.0)",
    "aiodns (>=4.0.0,<5.0.0)",
    "icmplib (>=3.0.4,<4.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.19.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"