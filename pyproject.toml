[project]
name = "bili-travail"
version = "2.40"
description = "基于blivedm的B站直播加班姬"
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
    "aiodns>=4.0.3",
    "aiohttp>=3.13.3",
    "apscheduler>=3.11.2",
    "brotli>=1.2.0",
    "icmplib>=3.0.4",
    "loguru>=0.7.3",
    "nicegui==3.15.0",
    "nuitka>=4.0.7",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pure-protobuf>=3.1.5",
    "py-cpuinfo>=9.0.0",
    "pywebview==6.2",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "tomlkit>=0.14.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "icecream>=2.2.0",
    "pyinstaller>=6.19.0",
    "qiniu>=7.17.0",
]
server = [
    "uvicorn (>=0.38.0,<1.0.0)",
    "fastapi (>=0.115.11,<1.0.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "orjson (>=3.11.5,<4.0.0)",
    "aiodns (>=3.6.1)",
    "minio>=7.2.20",
    "packaging>=24.0",
]

[[tool.uv.index]]
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true
