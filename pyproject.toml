[project]
name = "bili-travail"
version = "0.16.2-alpha"
description = "基于blivedm的B站直播加班姬"
authors = [
    {name = "Nya-WSL"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "nicegui (>=2.9.1,<3.0.0)",
    "pywebview (>=5.3.2,<6.0.0)",
    "pyinstaller (>=6.11.1,<7.0.0)",
    "brotli (>=1.1.0,<2.0.0)",
    "yarl (==1.9.3)",
    "aiohttp (==3.10.5)",
    "beautifulsoup4 (>=4.12.3,<5.0.0)",
    "selenium (>=4.27.1,<5.0.0)",
    "requests (>=2.32.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
