[project]
name = "bili-travail"
version = "0.31.6-alpha"
description = "基于blivedm的B站直播加班姬"
authors = [
    {name = "Nya-WSL"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "nicegui (==2.15.0)",
    "pywebview (>=5.3.2,<6.0.0)",
    "pyinstaller (>=6.11.1,<7.0.0)",
    "brotli (>=1.1.0,<2.0.0)",
    "yarl (==1.9.3)",
    "aiohttp (==3.10.5)",
    "requests (>=2.32.3,<3.0.0)",
    "qrcode[pil] (>=8.0,<9.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "py-cpuinfo (>=9.0.0,<10.0.0)",
    "aioping (>=0.4.0,<0.5.0)",
    "pure-protobuf (~=3.1.2)",
    "apscheduler (>=3.11.0,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"