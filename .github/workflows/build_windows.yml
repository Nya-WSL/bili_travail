name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - 'open-live/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changelog: ${{ steps.get_version.outputs.changelog_body }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # - name: Set up Python
      #   uses: actions/setup-python@v4
      #   with:
      #     python-version: '3.13.5'
      #     cache: 'pip'  # 缓存 pip 依赖
      
      # - name: Run Script
      #   id: run_script
      #   run: |
      #     content=$(python gh_action.py)
      #     echo "content=$content" >> $GITHUB_OUTPUT
      
      - name: Validate JSON files
        run: |
          # 验证 JSON 文件格式
          jq empty version.json
          echo "JSON files are valid"
      
      - name: Get Version and Changelog
        id: get_version
        run: |
          # 获取版本号
          VERSION=$(jq -r '.version' version.json)
          
          # 处理版本号，确保没有前缀
          VERSION=${VERSION#v}  # 移除可能存在的 v 前缀
          
          echo "版本号: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: v${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          body: |
            ### v${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}