name: Cleanup Actions Cache

# 每周一 0 点（中国时区，UTC+8）自动清理所有 GitHub Actions 缓存。
# 注意：GitHub Actions 的 schedule cron 固定使用 UTC 时区，需自行换算：
#   中国周一 00:00 = UTC 周日 16:00，故 cron 为 '0 16 * * 0'。
on:
  schedule:
    - cron: '0 16 * * 0'   # 每周一 00:00 中国时间（周日 16:00 UTC）
  workflow_dispatch:

permissions:
  actions: write   # 需要该权限才能调用 /actions/caches 接口删除缓存
  contents: read

jobs:
  cleanup-cache:
    runs-on: ubuntu-latest
    # 在 job 级统一注入 gh CLI 所需的 token，所有步骤均可使用
    # （gh 在 Actions 中要求设置 GH_TOKEN / GITHUB_TOKEN 环境变量，否则报错）
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 列出所有缓存的 cache_id
      - name: List all caches
        id: list-cache
        shell: bash
        run: |
          set -uo pipefail
          echo "=== 当前所有 Actions 缓存 ==="
          gh api "repos/${{ github.repository }}/actions/caches" \
            --paginate -q '.actions_caches[] | "\(.id)\t\(.key)\t\(.size_in_bytes)"' || true
          gh api "repos/${{ github.repository }}/actions/caches" \
            --paginate -q '.actions_caches[].id' > cache_ids.txt || true
          echo "count=$(wc -l < cache_ids.txt)" >> "$GITHUB_OUTPUT"
          echo "共列出 $(wc -l < cache_ids.txt) 条缓存"

      # 逐条按 cache_id 删除缓存。
      # 说明：gh CLI 的 actions-cache 子命令来自第三方扩展（actions/gh-actions-cache），
      # 默认未安装，故改用 GitHub REST API 直接 DELETE，仅依赖内置的 gh api。
      - name: Delete all caches
        run: |
          set -uo pipefail
          count=${{ steps.list-cache.outputs.count }}
          echo "待删除缓存数: $count"
          while read -r cache_id; do
            [ -z "$cache_id" ] && continue
            echo "删除缓存 id: $cache_id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$cache_id" || true
          done < cache_ids.txt
          echo "清理完成"

      # 汇报剩余缓存数（应接近 0）
      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(gh api "repos/${{ github.repository }}/actions/caches" \
            --paginate -q '.actions_caches[].id' | wc -l)
          echo "清理后剩余缓存数: $remaining"
